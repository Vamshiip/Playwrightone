name: Playwright Java Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Generate Allure Report
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v3

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠 Set up Maven
        uses: s4u/setup-maven-action@v1.11.0
        with:
          maven-version: '3.9.5'

      - name: 📦 Build Project and Run Tests
        run: mvn clean test

      - name: 📥 Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.23.0/allure-2.23.0.zip
          unzip allure-2.23.0.zip
          sudo mv allure-2.23.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: 📊 Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: ⬆️ Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
